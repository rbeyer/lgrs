[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lgrs"
description = "Coordinate conversion, grid generation, and projections for the Lunar Grid Reference System (LGRS)"
keywords = [
    "Moon", "lunar", "LGRS", "Artemis", "grid", "coordinates", "CRS", "WKT"
]
authors = [
    { name = "Ethan Schaefer", email = "eschaefer@seti.org" },
    { name = "Ross Beyer", email = "rbeyer@seti.org" }
]
dynamic = ["version", "readme"]

requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Environment :: Console",
    "Environment :: WebAssembly :: Emscripten",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Astronomy",
]
license = "Apache-2.0"
license-files = ["LICENSE", "AUTHORS.rst"]

dependencies = [
    "beartype", "geopandas", "numpy", "pyproj", "rasterio", "shapely", "typer"
]

[project.optional-dependencies]
reference = ["gdal"]

[project.urls]
Repository = "https://github.com/rbeyer/lgrs"
Documentation = "https://github.com/rbeyer/lgrs/blob/main/usage.rst"
"JavaScript guide" = "https://github.com/rbeyer/lgrs/blob/main/usage_js.rst"
Issues = "https://github.com/rbeyer/lgrs/issues"
Changelog = "https://github.com/rbeyer/lgrs/blob/main/CHANGELOG.rst"

[project.scripts]
lgrs = "lgrs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "lgrs.__version__" }
readme = { file = "README.rst" }

[tool.pytest.ini_options]
testpaths = [".", "tests", ]
addopts = [
    "--doctest-modules",
    "--ignore=src/lgrs/reference/LGRS_Grid_Generation.py",
    "--doctest-glob", "*.rst"
]


[tool.bumpversion]
current_version = "0.4.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:-(?P<release>[a-z]+))?"
serialize = ["{major}.{minor}.{patch}-{release}", "{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[tool.bumpversion.parts.release]
values = ["dev", "released"]
optional_value = "released"

[[tool.bumpversion.files]]
filename = "src/lgrs/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
glob = "examples/*.html"
search = 'lgrs==[^"]+'
replace = 'lgrs=={new_version}'
regex = true
include_bumps = ["release"]

[tool.black]
line-length = 79
force-exclude = "LGRS"
target-version = ["py313"]

[tool.flake8]
exclude = "src/lgrs/reference/LGRS_Coordinate_Conversion.py,src/lgrs/reference/LGRS_Grid_Generation.py"
ignore = ["E203", "E701", "E704", "W503"]
per-file-ignores = [
    "__init__.py: F401"  # imported but unused error
]

[tool.ufmt]
excludes = [
    "src/lgrs/reference/LGRS_Coordinate_Conversion.py",
    "src/lgrs/reference/LGRS_Grid_Generation.py",
]
